version: 2

# Monthly, not weekly, since 2026-09-14. Each weekly batch brought five or more
# PRs, each with its own CI run and notification, even when the code had not
# changed: what changes is what others publish. Security alerts do not follow
# this schedule and keep arriving as soon as they appear.
#
# cooldown: a freshly published version waits a few days before it is proposed.
# Broken releases are usually yanked or patched in that window, and majors, the
# ones that can break things, wait a month.
#
# Minor and patch updates arrive grouped and merge on their own once the checks
# pass (.github/workflows/dependabot-auto-merge.yml). Majors arrive one by one
# and wait for Kevin.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '05:00'
      timezone: Asia/Jerusalem
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    labels: [dependencies, area-infrastructure]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '05:30'
      timezone: Asia/Jerusalem
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions-all:
        patterns: ['*']
    labels: [dependencies, area-infrastructure]
    commit-message:
      prefix: ci
